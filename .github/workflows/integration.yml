name: Integration

# Runs the whole stack with Docker Compose and executes scripts/demo.sh.
# This is the project's end-to-end test: if it is green, the pipeline works.
on:
  push:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Run the end-to-end demo
        shell: bash
        run: scripts/demo.sh 2>&1 | tee demo.log

      - name: Publish the end of the logs as annotations
        if: failure()
        shell: bash
        run: |
          annotate() {
            python3 - "$1" "$2" <<'PY'
          import sys
          title, path = sys.argv[1], sys.argv[2]
          text = open(path, errors="replace").read()[-6000:]
          text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title={title}::{text}")
          PY
          }
          tail -n 40 demo.log > demo.tail
          annotate "demo.sh (last 40 lines)" demo.tail
          grep -E "Exception|Caused by|ERROR|Error:" demo.log | tail -n 25 > errors.tail || true
          annotate "errors found in the demo log" errors.tail
          docker compose --profile all logs --no-color --tail 25 > services.log 2>&1 || true
          tail -n 90 services.log > services.tail
          annotate "service logs (last lines)" services.tail

      - name: Show service logs on failure
        if: failure()
        run: docker compose --profile all logs --tail 150

      - name: Tear down
        if: always()
        run: docker compose --profile all down -v --remove-orphans
