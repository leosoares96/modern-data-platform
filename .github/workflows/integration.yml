name: Integration

# Runs the whole stack with Docker Compose and executes scripts/demo.sh.
# This is the project's end-to-end test: if it is green, the pipeline works.
on:
  push:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Run the end-to-end demo
        run: scripts/demo.sh
      - name: Show service logs on failure
        if: failure()
        run: docker compose --profile all logs --tail 150
      - name: Tear down
        if: always()
        run: docker compose --profile all down -v --remove-orphans
