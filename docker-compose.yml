name: modern-data-platform

# Profiles (see docs/decisions/0002-compose-profiles.md):
#   ingest         Kafka + event producer
#   lake           object store, Iceberg REST catalog and Spark cluster
#   stream         everything needed to run the bronze streaming job
#   orchestration  lake + Airflow
#   all            everything
x-kafka-profiles: &kafka-profiles [ingest, stream, all]

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    profiles: *kafka-profiles
    ports:
      - "9092:9092" # host access (EXTERNAL listener)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.0
    container_name: kafka-init
    profiles: *kafka-profiles
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC: flights.raw
    volumes:
      - ./scripts/create_topics.sh:/opt/platform/create_topics.sh:ro
    entrypoint: ["/bin/sh", "/opt/platform/create_topics.sh"]
    restart: "no"

  producer:
    build: ./producer/adsb
    container_name: producer
    profiles: *kafka-profiles
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      KAFKA_TOPIC: flights.raw
      EVENTS_FLEET_SIZE: ${EVENTS_FLEET_SIZE:-20}
      EVENTS_TICK_SECONDS: ${EVENTS_TICK_SECONDS:-1.0}
      PRODUCER_MAX_EVENTS: ${PRODUCER_MAX_EVENTS:-0}
      PRODUCER_SEED: ${PRODUCER_SEED:-}
      DUPLICATE_RATE: ${DUPLICATE_RATE:-0.02}
      LATE_RATE: ${LATE_RATE:-0.05}
      MALFORMED_RATE: ${MALFORMED_RATE:-0.02}
    restart: on-failure
